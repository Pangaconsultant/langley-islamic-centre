          return INITIAL_SEED;
        }

      const [volName, setVolName] = useState("");
      const [volWhatsApp, setVolWhatsApp] = useState("");

          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          } catch {}
          return next;
        });

        if (!kioskSuccess) return;
        setKioskCountdown(4);

            if (c <= 1) {
              clearInterval(t);
              setKioskSuccess(null);
              setKioskName("");
              setKioskMode(null);
              setKioskOccupants(2);
              return 4;
            }
            return c - 1;

        return () => clearInterval(t);

                      ...prev,
                      occupancy: { ...prev.occupancy, currentCount: nextCount, peakToday: Math.max(prev.occupancy.peakToday, nextCount) },
                      checkIns: [{ id: `chk-${Date.now()}`, visitorName: kioskName, travelMode: kioskMode, occupantCount: kioskMode === "Car Share" ? kioskOccupants : 1, activity: kioskActivity, timestamp: new Date().toISOString() }, ...prev.checkIns]
                    }));
                    setKioskSuccess({ name: kioskName, mode: kioskMode, activity: kioskActivity, newCount: nextCount });
                  }} className="space-y-5">
                    <div>
                      <label className="block text-sm font-extrabold text-[#005A9C] mb-2">1. Visitor Name (Tap Frequent Regular Chip or Type):</label>
                      <input type="text" required value={kioskName} onChange={(e) => setKioskName(e.target.value)} placeholder="Tap chip below or type name..." className="w-full h-12 px-4 rounded-xl border-2 border-[#D0E6F7] font-bold text-[#005A9C]" />
                      <div className="flex flex-wrap gap-2 mt-2.5">
                        {db.frequentVisitors.map((n) => (
                          <button key={n} type="button" onClick={() => setKioskName(n)} className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${kioskName === n ? "bg-[#005A9C] text-white" : "bg-[#F0F7FC] text-[#005A9C] border-[#D0E6F7]"}`}>{n}</button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-extrabold text-[#005A9C] mb-2">2. Mode of Travel:</label>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        {["Walking", "Bicycle", "Car Share", "Car / Drive"].map((m) => (
                          <button key={m} type="button" onClick={() => setKioskMode(m)} className={`p-4 rounded-xl font-extrabold text-sm border-2 ${kioskMode === m ? "bg-[#005A9C] text-white border-[#005A9C]" : "bg-[#F0F7FC] text-[#005A9C] border-[#D0E6F7]"}`}>{m}</button>
                        ))}
                      </div>
                      {kioskMode === "Car Share" && (
                        <div className="mt-3 p-4 rounded-xl bg-[#F0F7FC] border-2 border-[#009FE3] flex items-center justify-between">
                          <span className="text-xs font-extrabold text-[#005A9C]">Vehicle Occupant Count (Car Share):</span>
                          <div className="flex gap-2">
                            {[2, 3, 4].map((n) => (
                              <button key={n} type="button" onClick={() => setKioskOccupants(n)} className={`px-4 py-2 rounded-lg font-black text-sm ${kioskOccupants === n ? "bg-[#005A9C] text-white" : "bg-white text-[#005A9C] border"}`}>{n === 4 ? "4+" : n}</button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    <div>
                      <label className="block text-sm font-extrabold text-[#005A9C] mb-2">3. Auto-Detected Salah / Activity:</label>
                      <div className="grid grid-cols-4 sm:grid-cols-8 gap-2">
                        {["Fajr", "Zuhar", "Asr", "Maghrib", "Isha", "Quran Class", "Youth Circle", "Other"].map((act) => (
                          <button key={act} type="button" onClick={() => setKioskActivity(act)} className={`py-2.5 px-2 rounded-xl text-xs font-bold border ${kioskActivity === act ? "bg-[#009FE3] text-white" : "bg-[#F0F7FC] text-[#005A9C]"}`}>{act}</button>
                        ))}
                      </div>
                    </div>

                    <button type="submit" disabled={!kioskName || !kioskMode || count >= 40} className="w-full h-14 rounded-2xl bg-[#005A9C] disabled:bg-slate-300 text-white font-black text-lg">
                      TAP TO CHECK IN (+1 LIVE OCCUPANCY)
                    </button>
                  </form>
                )}
              </div>
            )}

            {route === "/occupancy" && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className={`p-6 rounded-2xl font-black text-white ${isRed ? "bg-red-600" : isAmber ? "bg-amber-500 text-slate-950" : "bg-emerald-600"}`}>
                  <div className="text-xs uppercase">Status Banner</div>
                  <div className="text-xl mt-1">
                    {isRed ? "RED (37–40): AT CAPACITY — ACTIVATE OVERFLOW PROTOCOL" : isAmber ? "AMBER (30–36): APPROACHING CAPACITY" : "GREEN (0–29): SAFE CAPACITY LEVEL"}
                  </div>
                </div>

                <div className="bg-white rounded-3xl border-2 border-[#D0E6F7] p-8 text-center space-y-6">
                  <div className="text-xs font-extrabold uppercase text-slate-500">Live 40-Person Occupancy & Door Marshal Counter</div>
                  <div className="text-7xl font-black text-[#005A9C]">Current: {count} / 40</div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <button onClick={() => updateDb((p) => ({ ...p, occupancy: { ...p.occupancy, currentCount: Math.min(40, p.occupancy.currentCount + 1) } }))} className="h-16 rounded-2xl bg-[#005A9C] text-white font-black text-lg">+1 Visitor Entry</button>
                    <button onClick={() => updateDb((p) => ({ ...p, occupancy: { ...p.occupancy, currentCount: Math.max(0, p.occupancy.currentCount - 1) } }))} className="h-16 rounded-2xl bg-[#009FE3] text-white font-black text-lg">-1 Visitor Exit</button>
                    <button onClick={() => updateDb((p) => ({ ...p, occupancy: { ...p.occupancy, currentCount: 0 } }))} className="h-16 rounded-2xl bg-red-100 text-red-800 font-black text-sm">Reset Session (0/40)</button>
                  </div>
                </div>
              </div>
            )}

            {route === "/assistant" && (
              <div className="bg-white rounded-3xl border-2 border-[#D0E6F7] p-6 sm:p-8 space-y-6">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 className="text-xl sm:text-2xl font-black text-[#005A9C]">9. 24/7 AI Community Assistant & Live Prayer Times (/assistant)</h2>
                    <p className="text-xs font-bold text-[#009FE3]">Grounded strictly in LIC official information</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => setRoute("/kiosk")} className="px-3 py-1.5 rounded-lg bg-[#005A9C] text-white text-xs font-bold">/kiosk</button>
                    <button onClick={() => setRoute("/parking")} className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-bold">/parking</button>
                    <button onClick={() => setRoute("/volunteer")} className="px-3 py-1.5 rounded-lg bg-[#009FE3] text-white text-xs font-bold">/volunteer</button>
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                  {PRAYER_TIMETABLE.map((p) => (
                    <div key={p.name} className="p-4 rounded-2xl bg-[#005A9C] text-white text-center">
                      <div className="text-xs font-bold text-[#7FD4FF]">{p.name}</div>
                      <div className="text-2xl font-black my-1">{p.jamaat}</div>
                      <div className="text-[11px] opacity-80">Adhan: {p.adhan}</div>
                    </div>
                  ))}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="p-5 rounded-2xl bg-amber-50 border-2 border-amber-500 space-y-1">
                    <div className="text-xs font-black uppercase text-amber-900">Off-Site Friday Jummah & Eid Prayers</div>
                    <div className="font-black text-amber-950 text-base">Langley Pavilion (NOT Held at Spitfire Close)</div>
                    <p className="text-xs text-amber-900">Friday Jummah and Eid prayers take place off-site at Langley Pavilion to protect Spitfire Close and respect our 40-person cap.</p>
                  </div>
                  <div className="p-5 rounded-2xl bg-[#F0F7FC] border-2 border-[#009FE3] space-y-1">
                    <div className="text-xs font-black uppercase text-[#009FE3]">Sisters' Quran Class</div>
                    <div className="font-black text-[#005A9C] text-base">Wednesdays 13:30–14:30</div>
                    <p className="text-xs text-slate-600">Weekly Sisters' Quran & Tafsir session at Spitfire Close (capped within 40-person limit).</p>
                  </div>
                </div>
              </div>
            )}

            {route === "/volunteer" && (
              <div className="bg-white rounded-3xl border-2 border-[#D0E6F7] p-6 sm:p-8 space-y-6">
                <div>
                  <h2 className="text-xl sm:text-2xl font-black text-[#005A9C]">10. Flexible Volunteer "Pick-a-Task" Scheduler (/volunteer)</h2>
                  <p className="text-xs text-slate-600">Self-serve micro-volunteering board with 1-tap Claim Shift (Name & WhatsApp) and 1-tap Release Shift.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {(db.volunteerTasks || INITIAL_SEED.volunteerTasks).map((t) => (
                    <div key={t.id} className={`p-5 rounded-2xl border-2 space-y-3 ${t.status === "Claimed" ? "bg-emerald-50 border-emerald-400" : "bg-[#F0F7FC] border-[#D0E6F7]"}`}>
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-extrabold text-[#009FE3]">{t.scheduleLabel}</span>
                        <span className={`px-2.5 py-0.5 rounded-full text-xs font-black ${t.status === "Claimed" ? "bg-emerald-200 text-emerald-900" : "bg-sky-100 text-[#005A9C]"}`}>{t.status}</span>
                      </div>
                      <div className="font-black text-[#005A9C] text-lg">{t.title}</div>
                      <p className="text-xs text-slate-600">{t.description}</p>

                      {t.status === "Claimed" ? (
                        <div className="flex items-center justify-between pt-2 border-t border-emerald-200">
                          <span className="text-xs font-bold text-emerald-900">Claimed by: {t.claimedByName} ({t.claimedByWhatsApp})</span>
                          <button onClick={() => updateDb((prev) => ({
                            ...prev,
                            volunteerTasks: prev.volunteerTasks.map((x) => x.id === t.id ? { ...x, status: "Open", claimedByName: undefined, claimedByWhatsApp: undefined } : x)
                          }))} className="px-3 py-1.5 rounded-lg bg-white border border-red-300 text-red-700 font-bold text-xs">
                            Release Shift
                          </button>
                        </div>
                      ) : claimId === t.id ? (
                        <form onSubmit={(e) => {
                          e.preventDefault();
                          if (!volName || !volWhatsApp) return;
                          updateDb((prev) => ({
                            ...prev,
                            volunteerTasks: prev.volunteerTasks.map((x) => x.id === t.id ? { ...x, status: "Claimed", claimedByName: volName, claimedByWhatsApp: volWhatsApp } : x)
                          }));
                          setClaimId(null);
                          setVolName("");
                          setVolWhatsApp("");
                        }} className="space-y-2 pt-2">
                          <input type="text" required value={volName} onChange={(e) => setVolName(e.target.value)} placeholder="Your Name *" className="w-full px-3 py-2 rounded-lg border text-xs bg-white" />
                          <input type="tel" required value={volWhatsApp} onChange={(e) => setVolWhatsApp(e.target.value)} placeholder="WhatsApp Number *" className="w-full px-3 py-2 rounded-lg border text-xs bg-white" />
                          <div className="flex gap-2">
                            <button type="submit" className="px-4 py-2 rounded-lg bg-[#005A9C] text-white font-bold text-xs">Confirm Claim</button>
                            <button type="button" onClick={() => setClaimId(null)} className="px-3 py-2 rounded-lg bg-white border text-xs font-bold">Cancel</button>
                          </div>
                        </form>
                      ) : (
                        <button onClick={() => setClaimId(t.id)} className="w-full py-2.5 rounded-xl bg-[#005A9C] text-white font-black text-xs">
                          Claim Shift (Name & WhatsApp)
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {route !== "/home" && route !== "/kiosk" && route !== "/occupancy" && route !== "/assistant" && route !== "/volunteer" && (
              <div className="bg-white rounded-3xl border-2 border-[#D0E6F7] p-6 sm:p-8 space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl sm:text-2xl font-black text-[#005A9C]">
                    Active Route: <code className="text-[#009FE3]">{route}</code>
                  </h2>
                  <span className="text-xs font-bold bg-[#F0F7FC] text-[#005A9C] px-3 py-1.5 rounded-lg border border-[#D0E6F7]">
                    Full Next.js Source in <code>src/app{route}/page.tsx</code>
                  </span>
                </div>

                {route === "/mentoring" && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    {db.mentors.map((m) => (
                      <div key={m.id} className="p-5 rounded-2xl bg-[#F0F7FC] border border-[#D0E6F7] space-y-2">
                        <div className="flex justify-between">
                          <span className="text-xs font-extrabold text-[#009FE3]">{m.sector}</span>
                          <span className="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-xs font-black">✓ DBS Verified ({m.dbsCertRef})</span>
                        </div>
                        <div className="font-black text-[#005A9C] text-lg">{m.name}</div>
                        <div className="text-xs text-slate-600">{m.role} • {m.availability}</div>
                      </div>
                    ))}
                  </div>
                )}

                {route === "/quran-classes" && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                    {db.quranSessions.map((s) => {
                      const enrolled = db.quranStudents.filter((st) => st.sessionId === s.id).length;
                      return (
                        <div key={s.id} className="p-5 rounded-2xl bg-[#F0F7FC] border border-[#D0E6F7] space-y-2">
                          <div className="flex justify-between">
                            <span className="font-black text-[#009FE3] text-xs">{s.timeWindow}</span>
                            <span className="font-black text-xs text-[#005A9C]">{enrolled} / 10 Students</span>
                          </div>
                          <div className="font-extrabold text-[#005A9C]">{s.title}</div>
                          <button onClick={() => alert(`5-Minute Pickup SMS/WhatsApp Alert Dispatched for ${s.timeWindow}!`)} className="w-full py-2 rounded-xl bg-[#005A9C] text-white font-bold text-xs">
                            Send Pickup Alert ({s.pickupAlertTime})
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}

                {route === "/events" && (
                  <div className="space-y-4 pt-2">
                    {db.events.map((e) => (
                      <div key={e.id} className="p-5 rounded-2xl bg-[#F0F7FC] border border-[#D0E6F7] space-y-3">
                        <div className="font-black text-[#005A9C] text-lg">{e.title} ({e.date})</div>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                          {e.slots.map((sl) => (
                            <div key={sl.id} className={`p-3.5 rounded-xl border ${sl.bookedCount >= sl.maxCapacity ? "bg-red-50 border-red-300 text-red-900" : "bg-white border-[#D0E6F7]"}`}>
                              <div className="font-bold text-xs">{sl.timeWindow}</div>
                              <div className="font-black text-sm mt-1">{sl.bookedCount} / {sl.maxCapacity} {sl.bookedCount >= sl.maxCapacity ? "(FULL - LOCKED)" : "Booked"}</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {route === "/carpool" && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    {db.carpoolMembers.map((cp) => (
                      <div key={cp.id} className="p-5 rounded-2xl bg-[#F0F7FC] border border-[#D0E6F7] space-y-2">
                        <div className="flex justify-between">
                          <span className="px-2.5 py-0.5 rounded bg-[#005A9C] text-white font-bold text-xs">{cp.role} • {cp.sector}</span>
                          <span className="text-xs font-bold text-slate-600">{cp.accepted ? `Unlocked: ${cp.privatePhone}` : "Phone Hidden (07700 ••••••)"}</span>
                        </div>
                        <div className="font-black text-[#005A9C]">{cp.name}</div>
                        <div className="text-xs text-slate-600">{cp.notes}</div>
                      </div>
                    ))}
                  </div>
                )}

                {route === "/parking" && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                    <div className="p-5 rounded-2xl bg-red-50 border-2 border-red-500 space-y-2">
                      <div className="font-black text-red-800 text-xs uppercase">Strictly No Parking (Red)</div>
                      <div className="font-black text-red-950">Spitfire Close Turning Head & Residential Bays</div>
                      <p className="text-xs text-red-900">Zero visitor parking, waiting, or idling at any time.</p>
                    </div>
                    <div className="p-5 rounded-2xl bg-emerald-50 border-2 border-emerald-500 space-y-2">
                      <div className="font-black text-emerald-800 text-xs uppercase">Permitted Parking (Green)</div>
                      <div className="font-black text-emerald-950">Common Road (2–3m) & Harrow Market (4–5m)</div>
                      <div className="flex flex-col gap-2 pt-1">
                        <a href="https://www.google.com/maps/search/?api=1&query=Common+Road+Langley+Slough+SL3+8J" target="_blank" className="py-2 px-3 rounded-lg bg-emerald-600 text-white font-bold text-xs text-center">Open Common Rd in Google Maps</a>
                        <a href="https://www.google.com/maps/search/?api=1&query=Harrow+Market+Car+Park+Langley+SL3+8HJ" target="_blank" className="py-2 px-3 rounded-lg bg-[#005A9C] text-white font-bold text-xs text-center">Open Harrow Market in Google Maps</a>
                      </div>
                    </div>
                    <div className="p-5 rounded-2xl bg-[#F0F7FC] border-2 border-[#009FE3] space-y-2">
                      <div className="font-black text-[#005A9C] text-xs uppercase">Active Travel (Blue)</div>
                      <div className="font-black text-[#005A9C]">On-Site Cycle Rack & SL3 Bus Stops</div>
                      <p className="text-xs text-slate-600">Covered cycle spaces at Spitfire Close entrance and nearby SL3 bus routes.</p>
                    </div>
                  </div>
                )}

                {route === "/neighbour-log" && (
                  <div className="space-y-4 pt-2">
                    {db.neighbourIncidents.map((inc) => (
                      <div key={inc.id} className="p-4 rounded-2xl bg-[#F0F7FC] border border-[#D0E6F7] space-y-1">
                        <div className="flex justify-between">
                          <span className="font-mono font-black text-xs text-[#005A9C]">{inc.ticketId} — {inc.category}</span>
                          <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold text-xs">{inc.status}</span>
                        </div>
                        <p className="text-xs text-slate-700">{inc.description}</p>
                        <p className="text-[11px] text-slate-500">Assigned: {inc.assignedLead} • Audit Note: {inc.investigationNotes}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
